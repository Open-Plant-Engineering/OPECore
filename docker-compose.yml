version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: ope-postgres
    environment:
      POSTGRES_USER: ope
      POSTGRES_PASSWORD: opepass
      POSTGRES_DB: opedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
syntax = "proto3";

option csharp_namespace = "OPEDbEngine.gRPC.Session";

package session;

service SessionService {
  rpc StartSession (StartSessionRequest) returns (StartSessionResponse);
  rpc CloseSession (CloseSessionRequest) returns (SessionActionResponse);
}

message StartSessionRequest {
  string userId = 1;
}

message StartSessionResponse {
  bool success = 1;
  string sessionId = 2;
  string message = 3;
  string errorCode = 4;
}

message CloseSessionRequest {
  string sessionId = 1;
}

message SessionActionResponse {
  bool success = 1;
  string message = 2;
  string errorCode = 3;
}
syntax = "proto3";

option csharp_namespace = "OPEDbEngine.gRPC.Node";

package node;

// ✅ MAIN SERVICE
service NodeService {
  rpc CreateNode (CreateNodeRequest) returns (CreateNodeResponse);
  rpc ClaimNode (ClaimNodeRequest) returns (ClaimNodeResponse);
  rpc SetAttribute (SetAttributeRequest) returns (SetAttributeResponse);
  rpc GetNode (GetNodeRequest) returns (NodeResponse);
  rpc StoreValue (StoreValueRequest) returns (StoreValueResponse);
  rpc RemoveAttribute (RemoveAttributeRequest) returns (RemoveAttributeResponse);
  rpc BulkSetAttributes (BulkSetAttributesRequest) returns (BulkSetAttributesResponse);
  rpc BulkRemoveAttributes (BulkRemoveAttributesRequest) returns (BulkRemoveAttributesResponse);
}

// ✅ CREATE NODE
message CreateNodeRequest {
  string nodeId = 1;
  string type = 2;
  string owner = 3;
  string sessionId = 4;
}

message CreateNodeResponse {
  string versionId = 1;
}

// ✅ CLAIM NODE
message ClaimNodeRequest {
  string nodeId = 1;
  string sessionId = 2;
}

message ClaimNodeResponse {
  bool success = 1;
}

// ✅ SET ATTRIBUTE
message SetAttributeRequest {
  string nodeId = 1;
  string versionId = 2;
  int32 key = 3;
  bytes valueHash = 4;
  int32 valueType = 5;
  string sessionId = 6;
}

message SetAttributeResponse {
  string newVersionId = 1;
}

// ✅ QUERY
message GetNodeRequest {
  string nodeId = 1;
}

message NodeResponse {
  string nodeId = 1;
  string versionId = 2;
  string type = 3;
  string owner = 4;

  repeated Attribute attributes = 5;
}

message Attribute {
  int32 key = 1;
  int32 valueType = 2;
  string value = 3;
}

// ✅ STORE VALUE
message StoreValueRequest {
  oneof value {
    string stringValue = 1;
    double numberValue = 2;
    bool boolValue = 3;
  }
}

message StoreValueResponse {
  bytes valueHash = 1;
  int32 valueType = 2;
}

// ✅ REMOVE ATTRIBUTE
message RemoveAttributeRequest {
  string nodeId = 1;
  string versionId = 2;
  int32 key = 3;
  string sessionId = 4;
}

message RemoveAttributeResponse {
  string newVersionId = 1;
}

message BulkSetAttributesRequest {
  string nodeId = 1;
  string versionId = 2;
  repeated AttributeWrite attributes = 3;
  string sessionId = 4;
}

message BulkSetAttributesResponse {
  string newVersionId = 1;
}

message BulkRemoveAttributesRequest {
  string nodeId = 1;
  string versionId = 2;
  repeated int32 keys = 3;
  string sessionId = 4;
}

message BulkRemoveAttributesResponse {
  string newVersionId = 1;
}

message AttributeWrite {
  int32 key = 1;
  bytes valueHash = 2;
  int32 valueType = 3;
}

